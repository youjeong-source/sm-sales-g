<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SM 매출관리 시스템 - 점검 중 | GOLDENAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;
    background:linear-gradient(135deg,#FAFAFA 0%,#F4F4F5 100%);
    color:#0F0F10;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;line-height:1.6
  }
  .wrap{
    max-width:520px;width:100%;text-align:center;
    background:#fff;border-radius:18px;
    padding:48px 40px;
    border:1px solid #E5E5E5;
    box-shadow:0 10px 40px rgba(0,0,0,.04)
  }
  .brand{
    font-weight:900;font-size:22px;letter-spacing:-.5px;
    color:#E60021;margin-bottom:6px
  }
  .subbrand{
    font-size:13px;color:#94A3B8;font-weight:600;margin-bottom:36px;letter-spacing:-.2px
  }
  .icon{
    width:80px;height:80px;border-radius:18px;
    background:linear-gradient(135deg,#FFE5E9,#FFB3C0);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;font-size:36px;line-height:1
  }
  h1{
    font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:14px;color:#0F0F10
  }
  .msg{
    font-size:14.5px;color:#475569;line-height:1.7;margin-bottom:8px;font-weight:500
  }
  .msg b{color:#0F0F10;font-weight:700}
  .detail{
    font-size:12px;color:#94A3B8;margin-top:24px;padding-top:24px;
    border-top:1px solid #F1F5F9;line-height:1.7
  }
  .footer{
    margin-top:28px;font-size:11.5px;color:#94A3B8;font-weight:500
  }
  .footer b{color:#475569}
  .pulse{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#E60021;margin-right:7px;vertical-align:middle;
    animation:pulse 1.8s ease-in-out infinite
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.8)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">🔧</div>
  <div class="brand">GOLDENAX</div>
  <div class="subbrand">SM 매출관리 시스템</div>
  <h1>시스템 점검 중입니다</h1>
  <p class="msg">
    <span class="pulse"></span>
    현재 시스템 업데이트가 진행 중입니다.<br/>
    잠시 후 다시 방문해주세요.
  </p>
  <div class="detail">
    이용에 불편을 드려 죄송합니다.<br/>
    문의사항은 SM본부로 연락 부탁드립니다.
  </div>
  <div class="footer">
    <b>GOLDENAX SM본부</b> · 2026
  </div>
</div>
</body>
</html>
